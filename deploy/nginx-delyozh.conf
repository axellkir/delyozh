# /etc/nginx/sites-available/delyozh  (+ ссылка в sites-enabled)
# HTTPS дописывает certbot: certbot --nginx -d delyozh.axellkir.tech
server {
    listen 80;
    listen [::]:80;
    server_name delyozh.axellkir.tech;

    root /var/www/delyozh;
    index index.html;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    gzip on;
    gzip_types text/javascript application/javascript application/json text/css image/svg+xml;

    # Файлы маленькие: браузер каждый раз сверяется с сервером, старый код не залипает.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / { try_files $uri $uri/ =404; }
}
