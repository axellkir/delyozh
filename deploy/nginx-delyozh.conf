# /etc/nginx/sites-available/delyozh  (+ ссылка в sites-enabled)
# HTTPS дописывает certbot: certbot --nginx -d delyozh.axellkir.tech
server {
    listen 80;
    listen [::]:80;
    server_name delyozh.axellkir.tech;

    root /var/www/delyozh;
    index index.html;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    gzip on;
    gzip_types text/javascript application/javascript application/json text/css image/svg+xml;

    # Файлы маленькие: браузер каждый раз сверяется с сервером, старый код не залипает.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    # сервер комнат для игры по сети (deploy/delyozh-server.service); долгий опрос держит запрос до 25 секунд
    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering off;
        client_max_body_size 512k;
    }
    location /server/ { return 404; }

    location / { try_files $uri $uri/ =404; }
}
